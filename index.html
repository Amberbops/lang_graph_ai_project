<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forge — AI Project Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #12141c;
    --panel: #1b1e29;
    --panel-2: #21252f;
    --border: #2c3140;
    --text: #e4e6ee;
    --text-dim: #8b93a7;
    --amber: #e8a33d;
    --teal: #4fba8f;
    --coral: #e85d4f;
    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: var(--font-body); min-height: 100vh;
  }
  ::selection { background: var(--amber); color: #12141c; }
  a { color: inherit; }

  /* ---------- Auth screen ---------- */
  .auth-shell {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(circle at 20% 20%, rgba(232,163,61,0.08), transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(79,186,143,0.08), transparent 40%),
      var(--bg);
  }
  .auth-card {
    width: 380px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; padding: 36px 32px;
  }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }
  .brand-mark {
    width: 34px; height: 34px; border-radius: 8px;
    background: linear-gradient(135deg, var(--amber), var(--coral));
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-mono); font-weight: 700; color: #12141c; font-size: 15px;
  }
  .brand-name { font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: -0.02em; }
  .auth-card h1 { font-family: var(--font-display); font-size: 22px; margin: 0 0 6px; }
  .auth-card p.sub { color: var(--text-dim); font-size: 13.5px; margin: 0 0 24px; }
  label { display: block; font-size: 12.5px; color: var(--text-dim); margin-bottom: 6px; margin-top: 16px; }
  input, textarea {
    width: 100%; background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    padding: 10px 12px; border-radius: 8px; font-family: var(--font-body); font-size: 14px;
    outline: none; transition: border-color 0.15s;
  }
  input:focus, textarea:focus { border-color: var(--amber); }
  input:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  button { cursor: pointer; font-family: var(--font-body); }
  .btn-primary {
    width: 100%; margin-top: 22px; background: var(--amber); color: #1a1206; border: none;
    padding: 11px; border-radius: 8px; font-weight: 600; font-size: 14px; transition: filter 0.15s;
  }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .switch-line { text-align: center; margin-top: 18px; font-size: 13px; color: var(--text-dim); }
  .switch-line button { background: none; border: none; color: var(--amber); font-size: 13px; padding: 0; }
  .error-msg { color: var(--coral); font-size: 13px; margin-top: 12px; display: none; }

  /* ---------- App shell ---------- */
  .app-shell { display: none; height: 100vh; }
  .app-shell.active { display: flex; }
  .sidebar {
    width: 268px; background: var(--panel); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; padding: 20px 16px; flex-shrink: 0;
  }
  .sidebar .brand { margin-bottom: 24px; padding: 0 4px; }
  .new-build-btn {
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    padding: 10px 12px; border-radius: 8px; font-size: 13.5px; font-weight: 500;
    display: flex; align-items: center; gap: 8px; margin-bottom: 18px; transition: border-color 0.15s;
  }
  .new-build-btn:hover { border-color: var(--amber); }
  .project-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
  .project-item {
    padding: 10px 12px; border-radius: 8px; cursor: pointer; font-size: 13.5px;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    border: 1px solid transparent;
  }
  .project-item:hover { background: var(--panel-2); }
  .project-item.active { background: var(--panel-2); border-color: var(--border); }
  .project-item .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .dot.pending { background: var(--text-dim); }
  .dot.running { background: var(--amber); animation: pulse 1.4s ease-in-out infinite; }
  .dot.done { background: var(--teal); }
  .dot.error { background: var(--coral); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
  @media (prefers-reduced-motion: reduce) { .dot.running { animation: none; } }
  .sidebar-footer { border-top: 1px solid var(--border); padding-top: 14px; margin-top: 12px; font-size: 12.5px; color: var(--text-dim); display: flex; justify-content: space-between; align-items: center; }
  .logout-btn { background: none; border: none; color: var(--text-dim); font-size: 12.5px; text-decoration: underline; }

  .main { flex: 1; overflow-y: auto; padding: 32px 40px; }
  .empty-state { color: var(--text-dim); margin-top: 120px; text-align: center; font-size: 14px; }
  .empty-state .big { font-family: var(--font-display); font-size: 20px; color: var(--text); margin-bottom: 8px; }

  /* New build panel */
  .panel { max-width: 640px; }
  .panel h2 { font-family: var(--font-display); font-size: 24px; margin: 0 0 4px; }
  .panel p.sub { color: var(--text-dim); font-size: 13.5px; margin: 0 0 26px; }
  .file-drop {
    border: 1px dashed var(--border); border-radius: 8px; padding: 16px; font-size: 13px;
    color: var(--text-dim); display: flex; align-items: center; justify-content: space-between; margin-top: 8px;
  }
  .file-drop input[type=file] { display: none; }
  .file-drop label { display: inline-block; margin: 0; padding: 6px 12px; background: var(--panel-2); border-radius: 6px; cursor: pointer; color: var(--text); font-size: 12.5px; }

  /* Pipeline rail */
  .rail { display: flex; align-items: center; margin: 28px 0 34px; }
  .rail-node { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 110px; }
  .rail-node .ring {
    width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--border);
    display: flex; align-items: center; justify-content: center; font-family: var(--font-mono);
    font-size: 13px; color: var(--text-dim); transition: all 0.25s;
  }
  .rail-node.active .ring { border-color: var(--amber); color: var(--amber); box-shadow: 0 0 0 4px rgba(232,163,61,0.15); animation: pulse 1.4s ease-in-out infinite; }
  .rail-node.done .ring { border-color: var(--teal); color: var(--teal); background: rgba(79,186,143,0.08); }
  .rail-node.error .ring { border-color: var(--coral); color: var(--coral); background: rgba(232,93,79,0.08); }
  .rail-node .label { font-size: 12px; color: var(--text-dim); }
  .rail-node.active .label, .rail-node.done .label { color: var(--text); }
  .rail-connector { flex: 1; height: 2px; background: var(--border); margin: 0 -6px 24px; position: relative; top: -12px; }
  .rail-connector.filled { background: var(--teal); }

  .status-banner {
    padding: 12px 16px; border-radius: 8px; font-size: 13.5px; margin-bottom: 20px;
    display: flex; align-items: center; gap: 10px;
  }
  .status-banner.error { background: rgba(232,93,79,0.1); border: 1px solid rgba(232,93,79,0.3); color: var(--coral); }
  .status-banner.done { background: rgba(79,186,143,0.1); border: 1px solid rgba(79,186,143,0.3); color: var(--teal); }

  .detail-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .detail-header h2 { font-family: var(--font-display); font-size: 24px; margin: 0; }
  .detail-actions { display: flex; gap: 10px; }
  .btn-ghost {
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 500;
  }
  .btn-ghost:hover { border-color: var(--amber); }
  .btn-ghost.danger:hover { border-color: var(--coral); color: var(--coral); }

  .split { display: flex; gap: 20px; margin-top: 24px; align-items: flex-start; }
  .file-tree { width: 240px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px; flex-shrink: 0; max-height: 480px; overflow-y: auto; }
  .file-tree .ft-title { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-dim); padding: 4px 8px 10px; }
  .file-node { padding: 7px 8px; border-radius: 6px; font-family: var(--font-mono); font-size: 12.5px; cursor: pointer; color: var(--text-dim); }
  .file-node:hover { background: var(--panel-2); color: var(--text); }
  .file-node.active { background: var(--panel-2); color: var(--amber); }
  .code-view { flex: 1; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 0; max-height: 480px; overflow: auto; min-height: 200px; }
  .code-view .cv-path { font-family: var(--font-mono); font-size: 12px; color: var(--text-dim); padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .code-view pre { margin: 0; padding: 16px; font-family: var(--font-mono); font-size: 12.5px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .code-view .cv-empty { padding: 40px; text-align: center; color: var(--text-dim); font-size: 13px; }
</style>
</head>
<body>

<!-- AUTH SCREEN -->
<div class="auth-shell" id="authShell">
  <div class="auth-card">
    <div class="brand"><div class="brand-mark">Fx</div><div class="brand-name">Forge</div></div>
    <h1 id="authTitle">Welcome back</h1>
    <p class="sub" id="authSub">Sign in to your build pipeline</p>
    <form id="authForm">
      <label for="email">Email</label>
      <input type="email" id="email" required autocomplete="email">
      <label for="password">Password</label>
      <input type="password" id="password" required autocomplete="current-password" minlength="8">
      <button class="btn-primary" type="submit" id="authSubmit">Sign in</button>
    </form>
    <div class="error-msg" id="authError"></div>
    <div class="switch-line">
      <span id="switchText">Don't have an account?</span>
      <button id="switchBtn" type="button">Create one</button>
    </div>
  </div>
</div>

<!-- APP SHELL -->
<div class="app-shell" id="appShell">
  <div class="sidebar">
    <div class="brand"><div class="brand-mark">Fx</div><div class="brand-name">Forge</div></div>
    <button class="new-build-btn" id="newBuildBtn">+ &nbsp;New build</button>
    <div class="project-list" id="projectList"></div>
    <div class="sidebar-footer">
      <span id="userEmail"></span>
      <button class="logout-btn" id="logoutBtn">Sign out</button>
    </div>
  </div>
  <div class="main" id="main">
    <div class="empty-state" id="emptyState">
      <div class="big">No project selected</div>
      Start a new build, or pick one from the list.
    </div>
  </div>
</div>

<script>
const API = window.location.origin;
let TOKEN = localStorage.getItem('forge_token') || null;
let ME = null;
let PROJECTS = [];
let ACTIVE_PROJECT_ID = null;
let POLL_TIMER = null;

// ---------- helpers ----------
async function api(path, opts = {}) {
  const headers = opts.headers || {};
  if (TOKEN) headers['Authorization'] = 'Bearer ' + TOKEN;
  const res = await fetch(API + path, { ...opts, headers });
  if (!res.ok) {
    let detail = 'Request failed';
    try { detail = (await res.json()).detail || detail; } catch (e) {}
    throw new Error(detail);
  }
  const ct = res.headers.get('content-type') || '';
  return ct.includes('application/json') ? res.json() : res;
}

// ---------- auth screen ----------
let isRegisterMode = false;
const authShell = document.getElementById('authShell');
const appShell = document.getElementById('appShell');
const authError = document.getElementById('authError');

document.getElementById('switchBtn').addEventListener('click', () => {
  isRegisterMode = !isRegisterMode;
  document.getElementById('authTitle').textContent = isRegisterMode ? 'Create your account' : 'Welcome back';
  document.getElementById('authSub').textContent = isRegisterMode ? 'Start building with Forge' : 'Sign in to your build pipeline';
  document.getElementById('authSubmit').textContent = isRegisterMode ? 'Create account' : 'Sign in';
  document.getElementById('switchText').textContent = isRegisterMode ? 'Already have an account?' : "Don't have an account?";
  document.getElementById('switchBtn').textContent = isRegisterMode ? 'Sign in' : 'Create one';
  authError.style.display = 'none';
});

document.getElementById('authForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  authError.style.display = 'none';
  try {
    if (isRegisterMode) {
      await api('/auth/register', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ email, password })
      });
    }
    const form = new URLSearchParams();
    form.set('username', email); form.set('password', password);
    const tokenRes = await api('/auth/login', { method: 'POST', headers: {'Content-Type': 'application/x-www-form-urlencoded'}, body: form });
    TOKEN = tokenRes.access_token;
    localStorage.setItem('forge_token', TOKEN);
    await bootApp();
  } catch (err) {
    authError.textContent = err.message;
    authError.style.display = 'block';
  }
});

document.getElementById('logoutBtn').addEventListener('click', () => {
  TOKEN = null; localStorage.removeItem('forge_token');
  clearTimeout(POLL_TIMER);
  appShell.classList.remove('active');
  authShell.style.display = 'flex';
});

// ---------- boot ----------
async function bootApp() {
  ME = await api('/me');
  document.getElementById('userEmail').textContent = ME.email;
  authShell.style.display = 'none';
  appShell.classList.add('active');
  await refreshProjects();
  schedulePoll();
}

if (TOKEN) { bootApp().catch(() => { TOKEN = null; localStorage.removeItem('forge_token'); }); }

// ---------- project list ----------
async function refreshProjects() {
  PROJECTS = await api('/projects');
  renderProjectList();
  if (ACTIVE_PROJECT_ID) renderMain();
}

function renderProjectList() {
  const list = document.getElementById('projectList');
  list.innerHTML = '';
  PROJECTS.forEach(p => {
    const item = document.createElement('div');
    item.className = 'project-item' + (p.id === ACTIVE_PROJECT_ID ? ' active' : '');
    item.innerHTML = `<span class="name">${escapeHtml(p.name)}</span><span class="dot ${p.status}"></span>`;
    item.addEventListener('click', () => { ACTIVE_PROJECT_ID = p.id; renderMain(); renderProjectList(); });
    list.appendChild(item);
  });
}

function schedulePoll() {
  clearTimeout(POLL_TIMER);
  POLL_TIMER = setTimeout(async () => {
    try { await refreshProjects(); } catch (e) {}
    schedulePoll();
  }, 2500);
}

// ---------- new build form ----------
document.getElementById('newBuildBtn').addEventListener('click', () => {
  ACTIVE_PROJECT_ID = null;
  renderProjectList();
  renderNewBuildForm();
});

function renderNewBuildForm() {
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="panel">
      <h2>New build</h2>
      <p class="sub">Describe what to build, or ground it in an SRS document.</p>
      <form id="buildForm">
        <label for="pname">Project name</label>
        <input id="pname" required placeholder="e.g. Customer Support Portal">
        <label for="pprompt">Prompt</label>
        <textarea id="pprompt" rows="5" required placeholder="Build a colourful modern todo app in html, css and js"></textarea>
        <label>SRS document (optional)</label>
        <div class="file-drop">
          <span id="fileLabel">No file selected</span>
          <label for="srsFile">Choose file</label>
          <input type="file" id="srsFile" accept=".txt,.md,.pdf,.docx">
        </div>
        <button class="btn-primary" type="submit" id="submitBuildBtn">Start build</button>
      </form>
    </div>
  `;
  document.getElementById('srsFile').addEventListener('change', (e) => {
    document.getElementById('fileLabel').textContent = e.target.files[0]?.name || 'No file selected';
  });
  document.getElementById('buildForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitBuildBtn');
    btn.disabled = true; btn.textContent = 'Starting…';
    const fd = new FormData();
    fd.set('name', document.getElementById('pname').value);
    fd.set('prompt', document.getElementById('pprompt').value);
    const file = document.getElementById('srsFile').files[0];
    if (file) fd.set('srs_file', file);
    try {
      const project = await api('/projects', { method: 'POST', body: fd });
      await refreshProjects();
      ACTIVE_PROJECT_ID = project.id;
      renderProjectList();
      renderMain();
    } catch (err) {
      btn.disabled = false; btn.textContent = 'Start build';
      alert(err.message);
    }
  });
}

// ---------- project detail ----------
const STEPS = ['planner', 'architect', 'coder'];
async function renderMain() {
  if (!ACTIVE_PROJECT_ID) {
    document.getElementById('main').innerHTML = `<div class="empty-state" id="emptyState"><div class="big">No project selected</div>Start a new build, or pick one from the list.</div>`;
    return;
  }
  const project = PROJECTS.find(p => p.id === ACTIVE_PROJECT_ID);
  if (!project) return;

  const stepIdx = project.status === 'done' ? 3 : STEPS.indexOf(project.current_step);
  const rail = STEPS.map((s, i) => {
    let cls = '';
    if (project.status === 'error' && i === stepIdx) cls = 'error';
    else if (i < stepIdx || project.status === 'done') cls = 'done';
    else if (i === stepIdx && project.status === 'running') cls = 'active';
    return `<div class="rail-node ${cls}"><div class="ring">${i+1}</div><div class="label">${s[0].toUpperCase()+s.slice(1)}</div></div>`;
  }).join('<div class="rail-connector ' + (project.status === 'done' ? 'filled' : '') + '"></div>');

  let banner = '';
  if (project.status === 'error') banner = `<div class="status-banner error">Build failed: ${escapeHtml(project.error_message || 'unknown error')}</div>`;
  if (project.status === 'done') banner = `<div class="status-banner done">Build complete — files are ready below.</div>`;

  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="detail-header">
      <h2>${escapeHtml(project.name)}</h2>
      <div class="detail-actions">
        <button class="btn-ghost" id="downloadBtn" ${project.status !== 'done' ? 'disabled style="opacity:.5;cursor:not-allowed;"' : ''}>Download zip</button>
        <button class="btn-ghost danger" id="deleteBtn">Delete</button>
      </div>
    </div>
    <p class="sub" style="color:var(--text-dim);font-size:13px;max-width:640px;">${escapeHtml(project.prompt)}</p>
    <div class="rail">${rail}</div>
    ${banner}
    <div class="split">
      <div class="file-tree"><div class="ft-title">Files</div><div id="fileTreeInner"></div></div>
      <div class="code-view" id="codeView"><div class="cv-empty">Select a file to preview it</div></div>
    </div>
  `;

  document.getElementById('deleteBtn').addEventListener('click', async () => {
    if (!confirm('Delete this project and its generated files?')) return;
    await api(`/projects/${project.id}`, { method: 'DELETE' });
    ACTIVE_PROJECT_ID = null;
    await refreshProjects();
    renderMain();
  });
  document.getElementById('downloadBtn').addEventListener('click', () => {
    if (project.status !== 'done') return;
    const a = document.createElement('a');
    a.href = `${API}/projects/${project.id}/download`;
    fetch(a.href, { headers: { 'Authorization': 'Bearer ' + TOKEN } })
      .then(r => r.blob()).then(blob => {
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url; link.download = `${project.name}.zip`; link.click();
        URL.revokeObjectURL(url);
      });
  });

  try {
    const { files } = await api(`/projects/${project.id}/files`);
    const tree = document.getElementById('fileTreeInner');
    if (!files.length) {
      tree.innerHTML = `<div style="color:var(--text-dim);font-size:12.5px;padding:8px;">No files yet</div>`;
    } else {
      tree.innerHTML = '';
      files.forEach(f => {
        const node = document.createElement('div');
        node.className = 'file-node';
        node.textContent = f;
        node.addEventListener('click', async () => {
          document.querySelectorAll('.file-node').forEach(n => n.classList.remove('active'));
          node.classList.add('active');
          const data = await api(`/projects/${project.id}/file?path=${encodeURIComponent(f)}`);
          document.getElementById('codeView').innerHTML = `<div class="cv-path">${escapeHtml(f)}</div><pre>${escapeHtml(data.content)}</pre>`;
        });
        tree.appendChild(node);
      });
    }
  } catch (e) {}
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
</script>
</body>
</html>
